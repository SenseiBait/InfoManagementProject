<!DOCTYPE html>
<html>
<head>
    <title>College Student Database</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        /* Banner styling */
        .school-banner {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1E4D2B; /* dark green */
            color: #FFD700; /* gold */
            padding: 10px 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .school-banner img {
            height: 50px;
            margin-right: 15px;
        }

        .school-banner h1 {
            font-size: 1.5rem;
            flex: 1;
            text-align: center;
            margin: 0;
        }

        /* Navbar tweaks to match banner */
        .navbar {
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <!-- School Banner -->
    <div class="school-banner">
        <a href="/"><img src="{{ url_for('static', filename='logo.png') }}" alt="School Logo"></a>
        <h1>UNIDA CHRISTIAN COLLEGES</h1>
    </div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="#">Info Management Project</a>
        {% if current_user.is_authenticated %}
            <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
        {% endif %}
    </nav>

    <!-- Page Content -->
    <div class="container mt-4">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert alert-info">{{ messages[0] }}</div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

</body>
</html>
