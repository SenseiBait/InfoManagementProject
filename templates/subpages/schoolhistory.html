<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>School History</title>

  <style>
    :root {
      --dark-green: #1E4D2B;
      --green: #145c34;
      --gold: #FFD700;
      --white: #ffffff;
      --off-white: #fdfdfd;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: var(--off-white);
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 260px;
      background-color: var(--dark-green);
      color: var(--white);
      padding: 25px;
    }

    .sidebar h2 {
      color: var(--gold);
      margin-bottom: 15px;
      font-size: 1.2em;
    }

    .sidebar ul {
      list-style: none;
      margin-bottom: 30px;
    }

    .sidebar li {
      border-left: 3px solid transparent;
      margin-bottom: 5px;
    }

    .sidebar a {
      text-decoration: none;
      color: var(--white);
      display: block;
      padding: 10px 12px;
    }

    .sidebar li:hover,
    .sidebar a.active {
      background-color: var(--green);
      border-left: 3px solid var(--gold);
    }

    .content {
      flex: 1;
      padding: 40px;
    }

    .content h1 {
      color: var(--dark-green);
      margin-bottom: 20px;
    }

    .card {
      background-color: var(--white);
      border: 2px solid var(--gold);
      border-radius: 10px;
      padding: 25px;
      margin-bottom: 20px;
    }

    .card h3 {
      color: var(--green);
      margin-bottom: 10px;
    }

    .card p {
      color: var(--dark-green);
      line-height: 1.6;
    }
  </style>
</head>

<body>

<div class="sidebar">
  <h2><a href="/main" style="text-decoration:none; color:#FFD700;">UNIDA CHRISTIAN COLLEGES</a></h2>

  <h2>Student Information</h2>
  <ul>
    <li><a href="/studentinfo" {% if active == 'studentinfo' %}class="active"{% endif %}>Student Information</a></li>
    <li><a href="/schoolhistory" {% if active == 'schoolhistory' %}class="active"{% endif %}>School History</a></li>
    <li><a href="/form137" {% if active == 'form137' %}class="active"{% endif %}>Grade History (Form 137)</a></li>
  </ul>

  <h2>Academic Performance</h2>
  <ul>
    <li><a href="/curriculum" {% if active == 'curriculum' %}class="active"{% endif %}>Curriculum</a></li>
    <li><a href="/grades" {% if active == 'grades' %}class="active"{% endif %}>Grades</a></li>
    <li><a href="/courses" {% if active == 'courses' %}class="active"{% endif %}>Enrolled Courses</a></li>
  </ul>
</div>

  <div class="content">
    <h1>PAGE HEADING HERE</h1>

    <div class="card">
      <h3>School History</h3>
      <p>
        Replace this text with content related to this page.
      </p>
    </div>
  </div>

</body>
</html>
